<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지은쌤 숙제방</title>
<style>
body{margin:0;background:#f7f2ed;color:#3e3733;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","PingFang SC",sans-serif}
.wrap{max-width:430px;margin:8vh auto;padding:16px}
.card{background:white;border:1px solid #eadfd8;border-radius:20px;padding:18px;box-shadow:0 5px 20px rgba(80,50,30,.05)}
h1{margin:0 0 4px;font-size:23px}
.cn{color:#8f857e;font-size:13px;margin-bottom:18px}
input{width:100%;box-sizing:border-box;border:1px solid #eadfd8;border-radius:12px;padding:11px;margin-top:8px;font:inherit}
button{width:100%;border:0;border-radius:12px;padding:11px;margin-top:10px;background:#ef9b83;color:white;font-weight:800}
.note{margin-top:14px;color:#8f857e;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>지은쌤 숙제방</h1>
    <div class="cn">智恩老师的作业室</div>
    <input placeholder="학생 이름 / 学生姓名">
    <input type="password" placeholder="PIN">
    <button>학생으로 들어가기</button>
    <div class="note">온라인 사이트 연결 테스트 중입니다.<br>页面连接测试中。</div>
  </div>
</div>
</body>
</html>
